<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калитка</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #f0f2f5;
            user-select: none;
        }
        .card {
            background: white;
            padding: 32px 24px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            width: 85%;
            max-width: 360px;
        }
        h2 {
            margin: 0 0 8px 0;
            color: #1a1a1a;
        }
        p {
            margin: 0 0 24px 0;
            color: #666;
            font-size: 15px;
        }
        .btn {
            background: #007aff;
            color: white;
            border: none;
            width: 100%;
            height: 70px;
            border-radius: 20px;
            font-size: 22px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 122, 255, 0.3);
            transition: all 0.2s ease;
        }
        .btn:active {
            transform: scale(0.97);
            background: #0062cc;
        }
        .btn:disabled {
            background: #b0c4de;
            box-shadow: none;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Калитка</h2>
    <p>Детский сад №45</p>
    <button id="openBtn" class="btn" onclick="openDoor()">ОТКРЫТЬ</button>
    <div id="status">Нажмите кнопку рядом с калиткой</div>
</div>

<script>
    // UUID сервиса и характеристики Mircod
    const SERVICE_UUID = 0xFE00;
    const CHAR_UUID    = 0xFE01;

    // Токен авторизации доступа (кадр 1168 из Wireshark, 145 байт)
    const AUTH_TOKEN_HEX = 
        "4d495203820000019364bdddd314ccbdfa4f8c5d1eaca4f8b1e5588dd9dc37a681f81568" +
        "347a1fc14313d4df73153913ab3d2a08b1818af6daacf0a02c27e0f935375a19d878291e" +
        "38413cfbbcd42f66a79833c0f8c5cc9bc1286469e1622a20839573d69cc269a24184d0ad" +
        "ef0012b59070a52ed5ae77d67256e507d6797c993c0a236774f80ba215f0e16aac78";

    function setStatus(text) {
        document.getElementById("status").innerText = text;
    }

    // Расчет CRC-CCITT (UtilsKt.a)
    function calculateCrc(bytes) {
        let s = 0xFFFF;
        for (let i = 0; i < bytes.length; i++) {
            let b = bytes[i];
            let s2 = (((s << 8) | (s >>> 8)) ^ b) & 0xFFFF;
            let s3 = (s2 ^ ((s2 & 0xFF) >>> 4)) & 0xFFFF;
            let s4 = (s3 ^ ((s3 << 12) & 0xFFFF)) & 0xFFFF;
            s = (s4 ^ (((s4 & 0xFF) << 5) & 0xFFFF)) & 0xFFFF;
        }
        return s;
    }

    // Сборка пакета MIR (UtilsKt.b)
    function buildPacket(command) {
        const timeSec = Math.floor(Date.now() / 1000);

        // 4 байта Unix Timestamp (Little-Endian)
        const timeBytes = new Uint8Array(4);
        const timeView = new DataView(timeBytes.buffer);
        timeView.setUint32(0, timeSec, true);

        // Расчет CRC16 от времени
        const crc = calculateCrc(timeBytes);

        // Буфер 12 байт
        const buffer = new ArrayBuffer(12);
        const view = new DataView(buffer);
        const bytes = new Uint8Array(buffer);

        // Префикс "MIR"
        bytes[0] = 0x4D; // M
        bytes[1] = 0x49; // I
        bytes[2] = 0x52; // R
        bytes[3] = command; // 0x04 (OPEN_DOOR_MANUAL)
        view.setUint16(4, 0, true); // Payload len = 0
        bytes.set(timeBytes, 6);   // Timestamp
        view.setUint16(10, crc, true); // CRC16

        return buffer;
    }

    function hexToBytes(hex) {
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < hex.length; i += 2) {
            bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
        }
        return bytes.buffer;
    }

    async function openDoor() {
        const btn = document.getElementById("openBtn");
        btn.disabled = true;

        try {
            if (!navigator.bluetooth) {
                setStatus("Ваш браузер не поддерживает Web Bluetooth!");
                btn.disabled = false;
                return;
            }

            setStatus("Поиск калитки OPPEN...");

            // Фильтр устройств по имени или сервису 0xFE00
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: "OPPEN" }],
                optionalServices: [SERVICE_UUID]
            });

            setStatus("Подключение к калитке...");
            const server = await device.gatt.connect();

            setStatus("Получение сервиса...");
            const service = await server.getPrimaryService(SERVICE_UUID);
            const characteristic = await service.getCharacteristic(CHAR_UUID);

            // 1. Отправляем токен доступа (Handle 0x002a)
            setStatus("Авторизация токена...");
            const tokenBuffer = hexToBytes(AUTH_TOKEN_HEX);
            await characteristic.writeValueWithResponse(tokenBuffer);

            // Небольшая задержка перед отправкой команды
            await new Promise(r => setTimeout(r, 200));

            // 2. Отправляем команду открытия (0x04)
            setStatus("Открытие калитки...");
            const openPacket = buildPacket(0x04);
            await characteristic.writeValueWithResponse(openPacket);

            setStatus("Калитка открыта!");

            // Отключаемся через 2 секунды
            setTimeout(() => {
                if (device.gatt.connected) {
                    device.gatt.disconnect();
                }
                btn.disabled = false;
                setStatus("Готово к следующему открытию");
            }, 2000);

        } catch (error) {
            console.error(error);
            setStatus("Ошибка: " + (error.message || error));
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
