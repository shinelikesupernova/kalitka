<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калитка и Вход</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
        }
        .header {
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 24px;
            margin: 0;
            color: #111;
        }
        .header p {
            font-size: 14px;
            color: #666;
            margin: 4px 0 0 0;
        }
        .container {
            width: 100%;
            max-width: 400px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .tile {
            background: white;
            border-radius: 20px;
            padding: 20px 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            min-height: 130px;
            justify-content: space-between;
        }
        .tile:active {
            transform: scale(0.97);
        }
        .tile.active {
            border-color: #007aff;
            background: #f8fbff;
        }
        .badge {
            position: absolute;
            top: 14px;
            right: 14px;
            background: #e5f1ff;
            color: #007aff;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .tile-icon {
            font-size: 34px;
            margin-bottom: 8px;
        }
        .tile-title {
            font-size: 16px;
            font-weight: 600;
            color: #222;
            line-height: 1.25;
        }
        .tile-status {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        .action-box {
            width: 100%;
            max-width: 400px;
            margin-top: 24px;
            background: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            box-sizing: border-box;
            text-align: center;
        }
        .btn-open {
            background: #007aff;
            color: white;
            border: none;
            width: 100%;
            height: 64px;
            border-radius: 18px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 122, 255, 0.3);
            transition: all 0.2s ease;
        }
        .btn-open:disabled {
            background: #c7d2e0;
            box-shadow: none;
            cursor: not-allowed;
        }
        .status-text {
            margin-top: 14px;
            font-size: 14px;
            color: #666;
            min-height: 20px;
        }
        .btn-scan {
            background: #f0f2f5;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 13px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Объекты</h1>
    <p>Детский сад №45</p>
</div>

<div class="container">
    <div id="tile-kalitka" class="tile active" onclick="selectDevice('kalitka')">
        <div class="badge" title="Bluetooth">ᛒ</div>
        <div class="tile-icon">🚪</div>
        <div>
            <div class="tile-title">Калитка</div>
            <div id="status-kalitka" class="tile-status">Выбрано</div>
        </div>
    </div>

    <div id="tile-vkhod" class="tile" onclick="selectDevice('vkhod')">
        <div class="badge" title="Bluetooth">ᛒ</div>
        <div class="tile-icon">🏢</div>
        <div>
            <div class="tile-title">Центр. вход</div>
            <div id="status-vkhod" class="tile-status">Корпус 2</div>
        </div>
    </div>
</div>

<div class="action-box">
    <button id="openBtn" class="btn-open" onclick="openSelected()">ОТКРЫТЬ</button>
    <div id="statusLog" class="status-text">Нажмите «Открыть» рядом с входом</div>
    <button id="scanBtn" class="btn-scan" onclick="startScanner()">🔍 Сканировать окружение</button>
</div>

<script>
    const SERVICE_UUID = 0xFE00;
    const CHAR_UUID    = 0xFE01;

    const DEVICES = {
        kalitka: {
            name: "Калитка",
            tokenHex: "4d495203820000019364bdddd314ccbdfa4f8c5d1eaca4f8b1e5588dd9dc37a681f81568" +
                      "347a1fc14313d4df73153913ab3d2a08b1818af6daacf0a02c27e0f935375a19d878291e" +
                      "38413cfbbcd42f66a79833c0f8c5cc9bc1286469e1622a20839573d69cc269a24184d0ad" +
                      "ef0012b59070a52ed5ae77d67256e507d6797c993c0a236774f80ba215f0e16aac78"
        },
        vkhod: {
            name: "Центр. вход (2 корпус)",
            tokenHex: "4d49520382000001730101cc7a5f5f50172a2983c3852ef41ae54e03113732a6609bbf90" +
                      "f19e45c6e73387cbad472c014cfbf27484cf9027c75b6833d7f663edfcdeb30e476ab772" +
                      "3b5bfafb899a089060aa76df9e3e3761e89c857cfa81b16c3000e44a8ae4d53b78a16ebd" +
                      "d9927842d3c4c2490b18d3e961a84a44a594b2f5b60265d38de6a0b745f0e16a4459"
        }
    };

    let selectedKey = "kalitka";

    function selectDevice(key) {
        selectedKey = key;
        document.getElementById("tile-kalitka").classList.toggle("active", key === "kalitka");
        document.getElementById("tile-vkhod").classList.toggle("active", key === "vkhod");
        document.getElementById("statusLog").innerText = "Выбран объект: " + DEVICES[key].name;
    }

    function calculateCrc(bytes) {
        let s = 0xFFFF;
        for (let i = 0; i < bytes.length; i++) {
            let b = bytes[i];
            let s2 = (((s << 8) | (s >>> 8)) ^ b) & 0xFFFF;
            let s3 = (s2 ^ ((s2 & 0xFF) >>> 4)) & 0xFFFF;
            let s4 = (s3 ^ ((s3 << 12) & 0xFFFF)) & 0xFFFF;
            s = (s4 ^ (((s4 & 0xFF) << 5) & 0xFFFF)) & 0xFFFF;
        }
        return s;
    }

    function buildPacket(command) {
        const timeSec = Math.floor(Date.now() / 1000);
        const timeBytes = new Uint8Array(4);
        new DataView(timeBytes.buffer).setUint32(0, timeSec, true);

        const crc = calculateCrc(timeBytes);
        const buffer = new ArrayBuffer(12);
        const view = new DataView(buffer);
        const bytes = new Uint8Array(buffer);

        bytes[0] = 0x4D; bytes[1] = 0x49; bytes[2] = 0x52; // "MIR"
        bytes[3] = command; // 0x04 (OPEN_DOOR_MANUAL)
        view.setUint16(4, 0, true);
        bytes.set(timeBytes, 6);
        view.setUint16(10, crc, true);

        return buffer;
    }

    function hexToBytes(hex) {
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < hex.length; i += 2) {
            bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
        }
        return bytes.buffer;
    }

    async function startScanner() {
        const log = document.getElementById("statusLog");
        if (!navigator.bluetooth || !navigator.bluetooth.requestLEScan) {
            log.innerText = "Фоновое автосканирование не поддерживается вашим Chrome. Нажмите «ОТКРЫТЬ» для прямого подключения.";
            return;
        }
        try {
            log.innerText = "Сканирование эфира BLE...";
            const scan = await navigator.bluetooth.requestLEScan({
                filters: [{ namePrefix: "OPPEN" }],
                keepRepeatedDevices: true
            });
            navigator.bluetooth.addEventListener("advertisementreceived", event => {
                log.innerText = `Рядом: ${event.device.name || "OPPEN"} (RSSI: ${event.rssi} dBm)`;
            });
        } catch (e) {
            log.innerText = "Сканер: " + (e.message || e);
        }
    }

    async function openSelected() {
        const dev = DEVICES[selectedKey];
        const btn = document.getElementById("openBtn");
        const log = document.getElementById("statusLog");

        btn.disabled = true;

        try {
            if (!navigator.bluetooth) {
                log.innerText = "Web Bluetooth не поддерживается";
                btn.disabled = false;
                return;
            }

            log.innerText = `Поиск ${dev.name}...`;

            const device = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: "OPPEN" }],
                optionalServices: [SERVICE_UUID]
            });

            log.innerText = "Подключение к замку...";
            const server = await device.gatt.connect();

            log.innerText = "Получение сервиса...";
            const service = await server.getPrimaryService(SERVICE_UUID);
            const characteristic = await service.getCharacteristic(CHAR_UUID);

            log.innerText = "Авторизация ключа доступа...";
            await characteristic.writeValueWithResponse(hexToBytes(dev.tokenHex));

            await new Promise(r => setTimeout(r, 200));

            log.innerText = "Открытие замка...";
            await characteristic.writeValueWithResponse(buildPacket(0x04));

            log.innerText = `✅ ${dev.name} открыта!`;

            setTimeout(() => {
                if (device.gatt.connected) device.gatt.disconnect();
                btn.disabled = false;
                log.innerText = "Готово к следующему открытию";
            }, 2500);

        } catch (error) {
            console.error(error);
            log.innerText = "Ошибка: " + (error.message || error);
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
